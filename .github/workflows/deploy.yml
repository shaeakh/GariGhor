name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Detect project path
        id: detect
        run: |
          if [ -f "package.json" ]; then
            echo "dir=." >> $GITHUB_OUTPUT
            echo "out_path=./out" >> $GITHUB_OUTPUT
          elif [ -f "project/package.json" ]; then
            echo "dir=project" >> $GITHUB_OUTPUT
            echo "out_path=./project/out" >> $GITHUB_OUTPUT
          else
            echo "dir=." >> $GITHUB_OUTPUT
            echo "out_path=./out" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: npm ci || npm install
        working-directory: ${{ steps.detect.outputs.dir }}

      - name: Build static site
        run: npm run build
        working-directory: ${{ steps.detect.outputs.dir }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.detect.outputs.out_path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
